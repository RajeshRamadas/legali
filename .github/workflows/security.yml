name: Security and regression checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    name: Dependency and source security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/security-requirements.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install verified security tools
        run: python -m pip install --require-hashes -r ci/security-requirements.txt
      - name: Validate dependency locks
        run: python scripts/check_python_locks.py
      - name: Audit Python and npm dependencies
        run: python scripts/audit_dependencies.py
      - name: Scan production Python source
        if: success() || failure()
        run: python scripts/scan_python.py
      - name: Retain security reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-security-reports
          path: security-reports/
          retention-days: 7
          if-no-files-found: warn

  api-security:
    name: API regression (${{ matrix.database }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: legali_ci
          POSTGRES_USER: legali_ci
          POSTGRES_PASSWORD: ci-test-password-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legali_ci -d legali_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://legali_ci:ci-test-password-only@127.0.0.1:5432/legali_ci' || 'sqlite://' }}
      APP_ENV: development
      JWT_SECRET: ci-only-session-secret-never-use-in-a-deployment
      NOTIFY_WORKER_ENABLED: 'false'
      BLOG_AGENT_ENABLED: 'false'
      RERA_SAMPLE_WHEN_EMPTY: 'false'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install document extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin tesseract-ocr-kan
      - name: Install verified API test dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.txt
          python -m pip check
          mkdir -p security-reports
      - name: Apply migrations to disposable PostgreSQL
        if: matrix.database == 'postgres'
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: python -m alembic upgrade head
      - name: Validate rendered deployment profiles without starting containers
        if: matrix.database == 'sqlite'
        run: python scripts/check_deployment_profiles.py
      - name: Run API security and business regressions
        working-directory: backend
        run: python -m pytest -q --junitxml=../security-reports/api-${{ matrix.database }}.xml
      - name: Gate synthetic verification screening quality without provider calls
        if: matrix.database == 'sqlite'
        working-directory: backend
        env:
          DATABASE_URL: sqlite://
        run: python -m app.verification_evaluation --output ../security-reports/verification-evaluation.json
      - name: Retain API test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: api-results-${{ matrix.database }}
          path: |
            security-reports/*.xml
            security-reports/verification-evaluation.json
          retention-days: 7
          if-no-files-found: warn

  web-validation:
    name: Web and shared-client validation
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the committed workspace graph
        run: npm ci --ignore-scripts
      - name: Check web, mobile and shared TypeScript
        run: npm run typecheck
      - name: Lint website source
        run: npm run lint --workspace frontend
      - name: Build production website
        run: npm run build --workspace frontend
      - name: Install Chromium for browser regressions
        run: npx --workspace frontend playwright install --with-deps chromium
      - name: Check accessibility and keyboard/mobile behavior
        run: npm run test:browser --workspace frontend
      - name: Retain browser reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-accessibility-reports
          path: |
            frontend/playwright-report/
            frontend/test-results/
            security-reports/browser-results.xml
          retention-days: 7
          if-no-files-found: warn
