<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Homexo UI · Interactive design demo</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#e9ebf2;color:#17192e;height:100dvh;display:flex;flex-direction:column}header{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:12px 18px;background:white;border-bottom:1px solid #ddd}h1{font-size:16px;margin:0}small{color:#636b81}nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}button{font:600 12px system-ui;min-height:40px;padding:8px 12px;background:transparent;border:1px solid #dce0eb;border-radius:9px;cursor:pointer;color:inherit}button[aria-selected=true]{background:#f1edff;color:#5b37f5;border-color:#f1edff}button:focus-visible{outline:2px solid #6d4aff;outline-offset:2px}.stage{flex:1;min-height:0;display:flex;justify-content:center}.stage.phone{padding:12px}iframe{width:100%;height:100%;border:0;background:white}.phone iframe{width:390px;max-width:100%;border-radius:20px;outline:5px solid #262a3d}body.dark{background:#080a12;color:#f2f3f8}body.dark header{background:#11131f;border-color:#262a3d}body.dark button{border-color:#343950}body.dark button[aria-selected=true]{background:#231c4d;color:#d0c5ff}body.dark small{color:#b4b8cc}@media(max-width:740px){header{padding:10px;gap:8px}header>div{flex:1}nav{flex-basis:100%;order:3;justify-content:space-between}nav button{padding:8px;font-size:11px}}
</style></head><body><header><div><h1>Homexo UI</h1><small>Design demo · fictional data</small></div><nav role="tablist" aria-label="Demo screens"></nav><button id="phone" type="button" aria-pressed="false">Phone view</button><button id="theme" type="button">Dark theme</button></header><div class="stage" role="tabpanel"><iframe title="Interactive design demo"></iframe></div><script>
const screens={public:['Public home','1-public-home.html'],customer:['Customer portal','2-customer-dashboard.html'],staff:['Staff workspace','3-staff-workspace.html'],assistant:['AI assistant','5-ai-assistant.html']};const frame=document.querySelector('iframe'),nav=document.querySelector('nav');let theme='light';try{theme=localStorage.getItem('hx-demo-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch{}function applyTheme(){document.body.classList.toggle('dark',theme==='dark');document.querySelector('#theme').textContent=theme==='dark'?'Light theme':'Dark theme';try{localStorage.setItem('hx-demo-theme',theme)}catch{}frame.contentWindow?.postMessage({type:'homexo-demo:theme',theme},location.protocol==='file:'?'*':location.origin)}function select(id){if(!screens[id])return;frame.src=screens[id][1];frame.title=screens[id][0]+' interactive design demo';for(const button of nav.children){button.setAttribute('aria-selected',button.dataset.screen===id);button.tabIndex=button.dataset.screen===id?0:-1}history.replaceState(null,'','#'+id)}for(const [id,[title]]of Object.entries(screens)){const button=document.createElement('button');button.type='button';button.textContent=title;button.dataset.screen=id;button.setAttribute('role','tab');button.onclick=()=>select(id);button.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const keys=Object.keys(screens),i=keys.indexOf(id),next=e.key==='Home'?0:e.key==='End'?keys.length-1:(i+(e.key==='ArrowRight'?1:keys.length-1))%keys.length;select(keys[next]);nav.children[next].focus()};nav.append(button)}document.querySelector('#theme').onclick=()=>{theme=theme==='light'?'dark':'light';applyTheme()};document.querySelector('#phone').onclick=e=>{const phone=document.querySelector('.stage').classList.toggle('phone');e.currentTarget.textContent=phone?'Full width':'Phone view';e.currentTarget.setAttribute('aria-pressed',phone)};frame.onload=applyTheme;window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.origin!==location.origin)return;if(e.data?.type==='homexo-demo:navigate')select(e.data.screen);if(e.data?.type==='homexo-demo:toggle-theme'){theme=theme==='light'?'dark':'light';applyTheme()}});applyTheme();select(location.hash.slice(1)||'public');
</script></body></html>
