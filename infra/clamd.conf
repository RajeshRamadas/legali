# Private scanner: files exceeding inspection limits or encrypted files are blocked.
User clamav
Foreground yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
LogTime yes
ScanArchive yes
ScanPDF yes
ScanOLE2 yes
AlertEncrypted yes
AlertExceedsMax yes
StreamMaxLength 30M
MaxFileSize 30M
MaxScanSize 100M
MaxRecursion 16
MaxFiles 10000
MaxScanTime 20000
