services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homexo}
      POSTGRES_USER: ${POSTGRES_USER:-homexo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "5432:5432"
    volumes:
      - homexo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homexo_app} -d ${POSTGRES_DB:-homexo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://homexo_app:change-this-local-password@db:5432/homexo}
      APP_ENV: ${APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-}
      # First admin for the staff workspace at /admin. Created only when no admin exists yet.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@homexo.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-change-this-admin-password}
      # Optional: turns on the AI chat assistant. Leave empty for rule-based answers.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VERIFICATION_LLM_PROVIDER: ${VERIFICATION_LLM_PROVIDER:-openai}
      VERIFICATION_LLM_MODEL: ${VERIFICATION_LLM_MODEL:-gpt-4.1-mini}
      VERIFICATION_LLM_API_KEY: ${VERIFICATION_LLM_API_KEY:-}
      VERIFICATION_LLM_BASE_URL: ${VERIFICATION_LLM_BASE_URL:-https://api.openai.com/v1}
      VERIFICATION_OCR_LANGUAGES: ${VERIFICATION_OCR_LANGUAGES:-eng}
      CHAT_MODEL: ${CHAT_MODEL:-claude-haiku-5-5}
      # Optional video meetings (docs/meetings.md): Google Calendar + Meet links, WhatsApp invites and reminders.
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_CALENDAR_USER: ${GOOGLE_CALENDAR_USER:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      MEETING_TIMEZONE: ${MEETING_TIMEZONE:-Asia/Kolkata}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      # Optional document storage (docs/documents.md): AWS S3, or Cloudflare R2 with S3_ENDPOINT_URL and S3_REGION=auto.
      # Without S3_BUCKET, files are kept in the api_storage volume.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      LOCAL_STORAGE_DIR: /data/storage
    volumes:
      - api_storage:/data/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  homexo_pgdata:
  api_storage:
