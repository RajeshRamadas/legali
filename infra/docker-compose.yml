services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homexo}
      POSTGRES_USER: ${POSTGRES_USER:-homexo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "5432:5432"
    volumes:
      - homexo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homexo_app} -d ${POSTGRES_DB:-homexo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
      - ./clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: &api-environment
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_TIMEOUT: ${CLAMAV_TIMEOUT:-30}
      CASE_FIRST_RESPONSE_HOURS: ${CASE_FIRST_RESPONSE_HOURS:-4}
      CASE_DEFAULT_TURNAROUND_DAYS: ${CASE_DEFAULT_TURNAROUND_DAYS:-7}
      CASE_ESCALATION_HOURS: ${CASE_ESCALATION_HOURS:-24}
      SUPPORT_RESPONSE_HOURS: ${SUPPORT_RESPONSE_HOURS:-72}
      SUPPORT_ESCALATION_HOURS: ${SUPPORT_ESCALATION_HOURS:-24}
      SUPPORT_REPLY_NOTIFICATIONS_ENABLED: ${SUPPORT_REPLY_NOTIFICATIONS_ENABLED:-false}
      SUPPORT_DEADLINE_EMAIL_ENABLED: ${SUPPORT_DEADLINE_EMAIL_ENABLED:-false}
      SUPPORT_OPEN_LIMIT: ${SUPPORT_OPEN_LIMIT:-5}
      SUPPORT_REQUESTS_PER_DAY: ${SUPPORT_REQUESTS_PER_DAY:-10}
      SUPPORT_MESSAGES_PER_DAY: ${SUPPORT_MESSAGES_PER_DAY:-50}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://homexo_app:change-this-local-password@db:5432/homexo}
      APP_ENV: ${APP_ENV:-development}
      # Non-development profiles must explicitly disable all development shortcuts.
      LOGIN_CODE_DEV_MODE: ${LOGIN_CODE_DEV_MODE:-true}
      PAYMENTS_TEST_MODE: ${PAYMENTS_TEST_MODE:-true}
      RERA_SAMPLE_WHEN_EMPTY: ${RERA_SAMPLE_WHEN_EMPTY:-true}
      NOTIFY_WORKER_ENABLED: ${NOTIFY_WORKER_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-}
      STAFF_MFA_ENCRYPTION_KEY: ${STAFF_MFA_ENCRYPTION_KEY:-}
      STAFF_REQUIRE_ADMIN_MFA: ${STAFF_REQUIRE_ADMIN_MFA:-}
      # First admin for the staff workspace at /admin. Created only when no admin exists yet.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL-admin@homexo.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD-change-this-admin-password}
      # Optional: turns on the AI chat assistant. Leave empty for rule-based answers.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VERIFICATION_LLM_PROVIDER: ${VERIFICATION_LLM_PROVIDER:-anthropic}
      VERIFICATION_LLM_MODEL: ${VERIFICATION_LLM_MODEL:-}
      VERIFICATION_EXTRACT_MODEL: ${VERIFICATION_EXTRACT_MODEL:-}
      VERIFICATION_COMPARE_MODEL: ${VERIFICATION_COMPARE_MODEL:-}
      VERIFICATION_SEND_PAGE_IMAGES: ${VERIFICATION_SEND_PAGE_IMAGES:-true}
      VERIFICATION_UPLOAD_CHECKS: ${VERIFICATION_UPLOAD_CHECKS:-true}
      VERIFICATION_CLASSIFY_MODEL: ${VERIFICATION_CLASSIFY_MODEL:-}
      VERIFICATION_LLM_API_KEY: ${VERIFICATION_LLM_API_KEY:-}
      VERIFICATION_LLM_BASE_URL: ${VERIFICATION_LLM_BASE_URL:-https://api.openai.com/v1}
      VERIFICATION_TOKEN_RATES: ${VERIFICATION_TOKEN_RATES:-}
      VERIFICATION_OCR_LANGUAGES: ${VERIFICATION_OCR_LANGUAGES:-eng+hin+kan}
      CHAT_MODEL: ${CHAT_MODEL:-claude-haiku-5-5}
      API_SUBMISSIONS_PER_HOUR: ${API_SUBMISSIONS_PER_HOUR:-20}
      API_LOOKUPS_PER_MINUTE: ${API_LOOKUPS_PER_MINUTE:-60}
      API_UPLOADS_PER_MINUTE: ${API_UPLOADS_PER_MINUTE:-20}
      API_AI_ACTIONS_PER_MINUTE: ${API_AI_ACTIONS_PER_MINUTE:-10}
      API_WRITES_PER_MINUTE: ${API_WRITES_PER_MINUTE:-60}
      API_DOWNLOADS_PER_MINUTE: ${API_DOWNLOADS_PER_MINUTE:-120}
      API_AUTH_PER_MINUTE: ${API_AUTH_PER_MINUTE:-60}
      OPS_QUEUE_WARN_MINUTES: ${OPS_QUEUE_WARN_MINUTES:-15}
      PRIVACY_REVIEW_DAYS: ${PRIVACY_REVIEW_DAYS:-30}
      PRIVACY_REQUESTS_PER_DAY: ${PRIVACY_REQUESTS_PER_DAY:-5}
      CHAT_RETENTION_DAYS: ${CHAT_RETENTION_DAYS:-90}
      CHAT_RETENTION_ENABLED: ${CHAT_RETENTION_ENABLED:-false}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-20}
      # Optional video meetings (docs/meetings.md): Google Calendar + Meet links, WhatsApp invites and reminders.
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_CALENDAR_USER: ${GOOGLE_CALENDAR_USER:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      MEETING_TIMEZONE: ${MEETING_TIMEZONE:-Asia/Kolkata}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      SMS_DEFAULT_COUNTRY_CODE: ${SMS_DEFAULT_COUNTRY_CODE:-91}
      NOTIFY_MAX_ATTEMPTS: ${NOTIFY_MAX_ATTEMPTS:-5}
      NOTIFY_RETRY_SECONDS: ${NOTIFY_RETRY_SECONDS:-60}
      NOTIFY_MAX_AGE_HOURS: ${NOTIFY_MAX_AGE_HOURS:-24}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      # Optional document storage (docs/documents.md): AWS S3, or Cloudflare R2 with S3_ENDPOINT_URL and S3_REGION=auto.
      # Without S3_BUCKET, files are kept in the api_storage volume.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-homexo/}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      LOCAL_STORAGE_DIR: /data/storage
    volumes:
      - api_storage:/data/storage
    ports:
      - "8000:8000"
    depends_on:
      clamav:
        condition: service_started
      db:
        condition: service_healthy

  verification-worker:
    profiles: [verification]
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.verification_jobs", "--loop"]
    environment:
      <<: *api-environment
      NOTIFY_WORKER_ENABLED: "false"
      BLOG_AGENT_ENABLED: "false"
    volumes:
      - api_storage:/data/storage
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_started

  backup:
    profiles: [maintenance]
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    build:
      context: ./backup
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://homexo_app:change-this-local-password@db:5432/homexo}
      BACKUP_PUBLIC_KEY_FILE: /run/keys/backup-public.asc
      BACKUP_OUTPUT_DIR: /backups
      LOCAL_STORAGE_DIR: /data/storage
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-homexo/}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - api_storage:/data/storage:ro
      - type: bind
        source: ${BACKUP_OUTPUT_DIR:-./backups}
        target: /backups
        bind:
          create_host_path: false
      - type: bind
        source: ${BACKUP_PUBLIC_KEY_FILE:-./backup-public.asc}
        target: /run/keys/backup-public.asc
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy

volumes:
  homexo_pgdata:
  api_storage:
  clamav_data:
